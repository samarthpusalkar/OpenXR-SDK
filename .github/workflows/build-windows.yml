name: Get Hello XR Executable

on:
  workflow_dispatch: # Gives you the manual play button

jobs:
  build-sample:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: |
          cmake -B build_dir -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=ON -DBUILD_LOADER=ON

      - name: Compile Executable
        run: |
          cmake --build build_dir --config Release --target hello_xr

      - name: Upload Hello XR Only
        uses: actions/upload-artifact@v4
        with:
          name: hello_xr_windows_x64
          path: build_dir/src/tests/hello_xr/Release/hello_xr.exe
